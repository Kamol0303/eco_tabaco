<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ECO · Innovation Tobacco</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">E</div>
      <div class="brand-text">
        <h1>ECO</h1>
        <span>INNOVATION TOBACCO</span>
      </div>
    </div>
    <div class="user-pill" id="userBadge">Mijoz</div>
  </header>

  <!-- Content Container -->
  <main class="container">
    <div class="hero-banner">
      <h2>Fermentlangan Original Mahsulotlar</h2>
      <p>Miqdorni kiriting yoki + / − orqali tanlab, buyurtma bering.</p>
    </div>

    <!-- 3 ta mahsulot kartasi -->
    <div id="productsList" class="products-list"></div>
  </main>

  <!-- Sticky Bottom Checkout Bar -->
  <div class="bottom-bar">
    <div class="bar-content">
      <div class="bar-info">
        <span class="bar-count" id="barCount">Tanlanmadi</span>
        <span class="bar-total" id="barTotal">0 so'm</span>
      </div>
      <button type="button" class="btn-order" id="btnOrder" disabled onclick="openOrderModal()">Buyurtma berish</button>
    </div>
  </div>

  <!-- Buyurtma berish Modal oynasi -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Buyurtmani rasmiylashtirish</h3>
        <button type="button" class="modal-close" onclick="closeOrderModal()">✕</button>
      </div>

      <div id="modalBody">
        <!-- Tanlangan tovarlar qisqacha ro'yxati -->
        <div class="order-summary-box" id="orderSummaryBox"></div>

        <div class="form-group">
          <label>Ismingiz</label>
          <input type="text" class="form-input" id="customerName" placeholder="Ismingizni kiriting" />
        </div>

        <div class="form-group">
          <label>Telefon raqamingiz *</label>
          <input type="tel" class="form-input" id="customerPhone" placeholder="+998 90 123 45 67" />
        </div>

        <div class="form-group">
          <label>Yetkazib berish manzili</label>
          <input type="text" class="form-input" id="customerAddress" placeholder="Shahar, tuman, ko'cha, uy..." />
          <button type="button" class="btn-gps" id="btnGps" onclick="getGpsLocation()">
            <span>📍 Mening geolokatsiyam</span>
          </button>
        </div>

        <div class="form-group">
          <label>Izoh (ixtiyoriy)</label>
          <input type="text" class="form-input" id="customerNote" placeholder="Mo'ljal yoki qo'shimcha eslatma" />
        </div>

        <button type="button" class="btn-submit-order" id="btnSubmit" onclick="submitOrder()">
          Buyurtmani tasdiqlash
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
